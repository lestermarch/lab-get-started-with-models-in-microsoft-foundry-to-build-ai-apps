name: get-started-foundry-models
metadata:
    template: get-started-foundry-models@0.1.0

services:
    ai-project:
        host: azure.ai.project
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}

    zava-review-moderation-agent:
        host: azure.ai.agent
        project: src/agent
        language: docker
        docker:
            remoteBuild: true
            image: zava-review-moderation-agent
        uses:
            - ai-project
        kind: hosted
        name: zava-review-moderation-agent
        description: Product review moderation agent for Zava
        protocols:
            - protocol: responses
              version: "2.0.0"
        env:
            AZURE_AI_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
        startupCommand: python -u app.py
        container:
            resources:
                cpu: "1.0"
                memory: 2.0Gi

hooks:
    postprovision:
        windows:
            name: postprovision
            kind: pwsh
            shell: pwsh
            run: ./scripts/postprovision.ps1
        posix:
            shell: sh
            run: ./scripts/postprovision.sh
